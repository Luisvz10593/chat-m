<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chat M</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Chat <b>M</b></div>
    <div class="chips">
      <button class="chip twitch" id="chip-twitch" data-platform="twitch" aria-pressed="true">
        <span class="dot"></span><span class="label">Twitch</span><span class="state" id="st-twitch">—</span>
      </button>
      <button class="chip kick" id="chip-kick" data-platform="kick" aria-pressed="true">
        <span class="dot"></span><span class="label">Kick</span><span class="state" id="st-kick">—</span>
      </button>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">⚙</button>
  </header>

  <main id="feed" aria-live="polite"></main>

  <button id="jump" hidden>↓ Mensajes nuevos</button>

  <footer class="composer">
    <div id="reply-bar" hidden>
      <span id="reply-text"></span>
      <button class="icon-btn small" id="reply-cancel" aria-label="Cancelar respuesta">✕</button>
    </div>
    <form id="send-form" autocomplete="off">
      <span class="target twitch">Twitch</span>
      <input id="input" maxlength="500" placeholder="Escribe en el chat de Twitch…" enterkeyhint="send">
      <button type="submit" id="send-btn">Enviar</button>
    </form>
    <button id="login-cta" class="cta" hidden>Inicia sesión con Twitch para escribir y moderar</button>
  </footer>

  <!-- Acciones sobre un mensaje -->
  <dialog id="actions">
    <div class="sheet">
      <div class="sheet-head">
        <span class="badge-platform" id="act-platform"></span>
        <strong id="act-user"></strong>
      </div>
      <p id="act-text" class="act-text"></p>
      <p id="act-note" class="note" hidden></p>
      <div class="grid">
        <button data-act="reply">↪ Responder</button>
        <button data-act="mention">@ Mencionar</button>
        <button data-act="delete" class="mod">🗑 Borrar mensaje</button>
        <button data-act="timeout60" class="mod">⏱ Timeout 1 min</button>
        <button data-act="timeout600" class="mod">⏱ Timeout 10 min</button>
        <button data-act="ban" class="mod danger">⛔ Banear</button>
      </div>
      <button class="close" data-act="close">Cancelar</button>
    </div>
  </dialog>

  <!-- Ajustes -->
  <dialog id="settings">
    <form class="sheet" id="settings-form" method="dialog">
      <h2>Ajustes</h2>

      <label>Canal de Twitch
        <input name="twitchChannel" placeholder="tu_canal" autocapitalize="off" spellcheck="false">
      </label>
      <label>Canal de Kick
        <input name="kickChannel" placeholder="tu_canal" autocapitalize="off" spellcheck="false">
      </label>

      <fieldset>
        <legend>Cuenta de Twitch (para escribir y moderar)</legend>
        <label>Client ID de tu app de Twitch
          <input name="twitchClientId" placeholder="abc123…" autocapitalize="off" spellcheck="false">
        </label>
        <p class="note">Registra esta URL como <i>OAuth Redirect URL</i> en dev.twitch.tv:<br><code id="redirect-url"></code></p>
        <div class="row">
          <span id="auth-status" class="note">Sin sesión</span>
          <button type="button" id="btn-login">Iniciar sesión</button>
          <button type="button" id="btn-logout" hidden>Cerrar sesión</button>
        </div>
      </fieldset>

      <label>Tamaño de letra
        <input type="range" name="fontSize" min="14" max="30" step="1">
      </label>
      <label class="check"><input type="checkbox" name="showTime"> Mostrar hora</label>
      <label class="check"><input type="checkbox" name="wakeLock"> Mantener la pantalla encendida</label>

      <details>
        <summary>Avanzado (Kick)</summary>
        <label>ID del chatroom de Kick (si no se detecta solo)
          <input name="kickChatroomId" inputmode="numeric" placeholder="automático">
        </label>
        <p class="note">Ábrelo en el navegador: <code>kick.com/api/v2/channels/TU_CANAL</code> y busca <code>"chatroom":{"id":…</code></p>
      </details>

      <div class="row end">
        <button type="button" id="btn-clear">Limpiar chat</button>
        <button value="cancel" formnovalidate>Cancelar</button>
        <button value="save" class="primary" id="btn-save">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
